<abp-modal [(visible)]="visible" [busy]="form.invalid">
  <ng-template #abpHeader>
    <h3>{{ (edition ? '::EditEdition' : '::NewEdition') | abpLocalization }}</h3>
  </ng-template>

  <ng-template #abpBody>
    <form [formGroup]="form" (ngSubmit)="submitForm()">
      <div class="form-group">
        <label for="edition-name">{{ '::Name' | abpLocalization }} *</label>
        <input type="text" id="edition-name" class="form-control" formControlName="name" [readonly]="edition" />
      </div>

      <div class="form-group">
        <label for="edition-displayName">{{ '::DisplayName' | abpLocalization }} *</label>
        <input type="text" id="edition-displayName" class="form-control" formControlName="displayName" />
      </div>

      <div class="row">
        <div class="col-md-6">
          <div class="form-group">
            <label for="edition-monthlyPrice">{{ '::MonthlyPrice' | abpLocalization }} *</label>
            <input type="number" id="edition-monthlyPrice" class="form-control" formControlName="monthlyPrice" step="0.01" />
          </div>
        </div>

        <div class="col-md-6">
          <div class="form-group">
            <label for="edition-yearlyPrice">{{ '::YearlyPrice' | abpLocalization }} *</label>
            <input type="number" id="edition-yearlyPrice" class="form-control" formControlName="yearlyPrice" step="0.01" />
          </div>
        </div>
      </div>

      <div class="form-group">
        <label for="edition-features">{{ '::FeatureLimits' | abpLocalization }}</label>
        <textarea id="edition-features" class="form-control" rows="6" [(ngModel)]="featureLimitsJson" [ngModelOptions]="{standalone: true}"></textarea>
        <small class="form-text text-muted">{{ '::FeatureLimitsJsonHint' | abpLocalization }}</small>
      </div>

      <div class="form-check">
        <input type="checkbox" id="edition-isActive" class="form-check-input" formControlName="isActive" />
        <label for="edition-isActive" class="form-check-label">
          {{ '::IsActive' | abpLocalization }}
        </label>
      </div>
    </form>
  </ng-template>

  <ng-template #abpFooter>
    <button type="button" class="btn btn-secondary" (click)="close()">
      {{ '::Cancel' | abpLocalization }}
    </button>
    <button type="button" class="btn btn-primary" (click)="submitForm()" [disabled]="form.invalid">
      <i class="fa fa-check mr-1"></i>
      {{ '::Save' | abpLocalization }}
    </button>
  </ng-template>
</abp-modal>
